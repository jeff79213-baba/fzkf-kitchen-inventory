<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7a45">
<title>風自然廚房庫存管理</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#1d2129; --muted:#6b7280;
  --line:#e5e7eb; --primary:#ff7a45; --primary-t:#ffffff;
  --danger:#e5484d; --ok:#16a34a; --ok-bg:#e8f8ee; --danger-bg:#fdeaea;
  --chip:#eef0f3; --shadow:0 1px 3px rgba(0,0,0,.08);
  --header:#ffffff;
}
html[data-theme="dark"]{
  --bg:#111417; --card:#1b1f23; --text:#e8eaed; --muted:#9aa0a6;
  --line:#2c3238; --primary:#ff8a5b; --primary-t:#1a1200;
  --danger:#ff6b6b; --ok:#7ddc9b; --ok-bg:#14301f; --danger-bg:#3a1c1c;
  --chip:#242a30; --shadow:0 1px 3px rgba(0,0,0,.5);
  --header:#171b1f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  font-size:17px; line-height:1.5; padding-bottom:40px;
}
header{
  position:sticky; top:0; z-index:30; background:var(--header);
  display:flex; align-items:center; gap:8px; padding:12px 14px;
  border-bottom:1px solid var(--line); box-shadow:var(--shadow);
}
header h1{font-size:18px; margin:0; flex:1; font-weight:800; letter-spacing:.5px}
.icon-btn{
  border:none; background:var(--chip); color:var(--text); border-radius:12px;
  width:46px; height:46px; font-size:22px; cursor:pointer; display:inline-flex;
  align-items:center; justify-content:center;
}
.icon-btn:active{transform:scale(.94)}

nav#tabs{
  position:sticky; top:71px; z-index:20; background:var(--header);
  display:flex; gap:8px; overflow-x:auto; padding:8px 12px; border-bottom:1px solid var(--line);
  scrollbar-width:none;
}
nav#tabs::-webkit-scrollbar{display:none}
.tab{
  position:relative; flex:0 0 auto; border:1px solid var(--line); background:var(--card);
  color:var(--text); border-radius:999px; padding:10px 16px; font-size:16px;
  font-weight:600; cursor:pointer; white-space:nowrap;
}
.tab.active{background:var(--primary); color:var(--primary-t); border-color:var(--primary)}
.tab .badge{
  position:absolute; top:-6px; right:-6px; min-width:22px; height:22px; padding:0 5px;
  background:var(--danger); color:#fff; border-radius:999px; font-size:13px;
  font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid var(--header);
}
main{padding:12px 12px 30px; max-width:640px; margin:0 auto}
.cat-head{display:flex; align-items:baseline; gap:8px; margin:6px 4px 12px}
.cat-head h2{margin:0; font-size:20px}
.cat-head .sub{color:var(--muted); font-size:14px}

.card{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:14px; margin-bottom:12px; box-shadow:var(--shadow);
}
.card .top{display:flex; align-items:flex-start; gap:8px}
.card .name{font-size:18px; font-weight:700; flex:1}
.card .target{color:var(--muted); font-size:14px; margin-top:2px}
.card .note{color:var(--muted); font-size:14px; margin-top:6px; word-break:break-word}
.tag{display:inline-block; font-size:12px; background:var(--chip); color:var(--muted);
  border-radius:8px; padding:2px 7px; margin-left:6px; vertical-align:middle}
.edit-btn{border:none; background:transparent; font-size:20px; cursor:pointer; padding:4px 6px; color:var(--muted)}
.qty{display:flex; align-items:center; gap:10px; margin-top:12px}
.qty .lbl{font-size:14px; color:var(--muted); margin-right:auto}
.step{
  width:52px; height:52px; border-radius:14px; border:1px solid var(--line);
  background:var(--chip); color:var(--text); font-size:26px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.step:active{transform:scale(.93)}
input.stock{
  width:88px; height:52px; text-align:center; font-size:22px; font-weight:700;
  border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--text);
}
input.stock:focus{outline:2px solid var(--primary); border-color:var(--primary)}
.status{margin-top:12px; font-size:16px; font-weight:700}
.need{color:var(--danger); background:var(--danger-bg); border-radius:10px; padding:8px 12px; display:inline-block}
.ok{color:var(--ok); background:var(--ok-bg); border-radius:10px; padding:8px 12px; display:inline-block}

.addbtn{
  width:100%; padding:16px; border:2px dashed var(--line); border-radius:16px;
  background:transparent; color:var(--muted); font-size:17px; font-weight:700; cursor:pointer;
}
.addbtn:active{background:var(--chip)}

.empty{color:var(--muted); text-align:center; padding:30px 10px}

/* 全部品項頁 */
.chips{display:flex; flex-wrap:wrap; gap:8px; padding:2px 0 8px}
.chip{
  border:1px solid var(--line); background:var(--card); color:var(--text);
  border-radius:999px; padding:9px 14px; font-size:15px; font-weight:600; cursor:pointer;
}
.chip:active{background:var(--chip)}
.allhint{font-size:12px; color:var(--muted); margin:0 2px 12px}
.cat-section{margin-bottom:14px}
.cat-sec-head{
  display:flex; align-items:center; gap:8px; position:sticky; top:131px; z-index:6;
  background:var(--bg); padding:8px 2px; border-bottom:2px solid var(--line);
}
.cat-sec-name{font-size:17px; font-weight:800; flex:1; min-width:0; word-break:break-word}
.cat-sec-tools{display:flex; gap:6px; flex:0 0 auto}
.mini-edit{
  border:1px solid var(--line); background:var(--card); color:var(--text);
  border-radius:10px; min-width:40px; height:40px; padding:0 8px; font-size:16px; font-weight:800; cursor:pointer;
}
.mini-edit:active{background:var(--chip)}
.addbtn.sm{margin-top:6px; padding:12px; font-size:15px}

/* 調整分類順序 */
#sortList{display:flex; flex-direction:column; gap:8px; margin:4px 0 14px; max-height:58vh; overflow-y:auto}
.sortrow{
  display:flex; align-items:center; gap:10px; padding:4px; border-radius:16px;
  background:var(--card); transition:transform .12s, box-shadow .12s, background .12s;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
}
.sortrow.drag-active{
  background:var(--bg); box-shadow:0 10px 24px rgba(0,0,0,.3);
  outline:2px solid var(--primary); transform:scale(1.03); position:relative; z-index:20;
}
.sortbtn{
  width:56px; height:56px; flex:0 0 auto; border:1px solid var(--line); background:var(--chip);
  color:var(--text); border-radius:14px; font-size:22px; font-weight:800; cursor:pointer;
}
.sortbtn:disabled{opacity:.3}
.sortbtn:active:not(:disabled){background:var(--line)}
.sortname{flex:1; min-width:0; font-size:17px; font-weight:700; word-break:break-word}

/* 全部品項頁 */
.all-cat{
  font-size:16px; font-weight:800; margin:16px 2px 6px; padding-bottom:6px;
  border-bottom:2px solid var(--line); position:sticky; top:131px; background:var(--bg);
  z-index:5;
}
.allrow{
  display:flex; align-items:center; gap:10px; background:var(--card);
  border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:8px;
}
.allrow-main{flex:1; min-width:0}
.allrow-name{font-size:17px; font-weight:700; word-break:break-word}
.allrow-meta{font-size:13px; color:var(--muted); margin-top:3px}
.needtxt{color:var(--danger); font-weight:700}
.oktxt{color:var(--ok); font-weight:700}
.all-empty{color:var(--muted); font-size:14px; padding:4px 4px 8px}
.ctrls{display:flex; flex-direction:column; gap:6px; flex:0 0 auto}
.mini{font-size:12px; color:var(--muted); width:26px; text-align:center}
.qty.compact{margin-top:0; gap:4px}
.step.sm{width:44px; height:44px; font-size:22px; border-radius:12px}
input.stock.sm{width:60px; height:44px; font-size:19px; border-radius:12px}

/* 補貨清單頁 */
.preview{
  background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px;
  white-space:pre-wrap; word-break:break-word; font-size:16px; line-height:1.7;
  font-family:"Microsoft JhengHei","Noto Sans TC",monospace; margin-bottom:14px; overflow-x:auto;
}
.btn-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.big{
  border:none; border-radius:14px; padding:18px 10px; font-size:17px; font-weight:700;
  cursor:pointer; background:var(--chip); color:var(--text);
}
.big.primary{background:var(--primary); color:var(--primary-t)}
.big:active{transform:scale(.97)}

/* 設定選單 */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40}
.sheet{
  position:fixed; z-index:50; left:0; right:0; bottom:0; background:var(--card);
  border-radius:20px 20px 0 0; padding:14px; display:flex; flex-direction:column; gap:8px;
  max-width:640px; margin:0 auto; max-height:85vh; overflow-y:auto;
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
}
.sheet button{
  text-align:left; border:none; background:var(--chip); color:var(--text); border-radius:14px;
  padding:16px; font-size:17px; font-weight:600; cursor:pointer;
}
.sheet button:active{transform:scale(.98)}
.sheet hr{border:none; border-top:1px solid var(--line); width:100%; margin:2px 0}

/* Modal */
.modal{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.5); display:flex;
  align-items:flex-end; justify-content:center}
.modal-card{
  background:var(--card); width:100%; max-width:640px; border-radius:20px 20px 0 0;
  padding:18px; max-height:92vh; overflow-y:auto;
  padding-bottom:calc(18px + env(safe-area-inset-bottom));
}
.modal-card h2{margin:0 0 14px; font-size:20px}
.modal-card label{display:block; font-size:14px; color:var(--muted); margin-bottom:12px}
.modal-card label input,.modal-card label select{
  display:block; width:100%; margin-top:5px; padding:13px; font-size:17px;
  border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--text);
}
.modal-card label.chk{display:flex; align-items:center; gap:10px; font-size:16px; color:var(--text)}
.modal-card label.chk input{width:24px; height:24px; margin:0}
.modal-actions{display:flex; gap:10px; margin-top:6px}
.modal-actions button{
  flex:1; padding:16px; border:none; border-radius:14px; font-size:17px; font-weight:700;
  background:var(--chip); color:var(--text); cursor:pointer;
}
.modal-actions button.primary{background:var(--primary); color:var(--primary-t)}
.modal-actions button.danger{background:var(--danger-bg); color:var(--danger)}
.copyhint{font-size:14px; color:var(--muted); margin:0 0 10px}
.fieldhint{font-size:13px; color:var(--muted); margin:-6px 0 12px; line-height:1.4}
.copyarea{width:100%; height:38vh; padding:12px; font-size:13px; line-height:1.5; border:1px solid var(--line);
  border-radius:12px; background:var(--bg); color:var(--text); font-family:monospace; resize:vertical; margin-bottom:12px}
.hidden{display:none !important}

#toast{
  position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px);
  background:#222; color:#fff; padding:12px 20px; border-radius:12px; font-size:15px;
  opacity:0; pointer-events:none; transition:.25s; z-index:100; max-width:90vw; text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--danger)}

#printArea{display:none}

@media print{
  body{background:#fff; color:#000; padding:0; font-size:11px}
  header, nav#tabs, main, .overlay, .sheet, .modal, #toast{display:none !important}
  #printArea{display:block; color:#000}
  #printArea h1{font-size:16px; margin:0 0 2px}
  #printArea .date{font-size:12px; margin-bottom:8px}
  #printArea .cat{font-size:13px; font-weight:700; border-bottom:1px solid #000;
    margin-top:8px; padding-bottom:2px}
  #printArea .row{font-size:12px; line-height:1.5; padding-left:2px}
  #printArea .total{font-size:12px; font-weight:700; margin-top:10px; border-top:1px solid #000; padding-top:4px}
}
</style>
</head>
<body>
<header>
  <h1>風自然廚房庫存管理</h1>
  <button class="icon-btn" data-action="theme-toggle" title="切換深色模式">🌗</button>
  <button class="icon-btn" data-action="open-menu" title="設定">⚙️</button>
</header>

<nav id="tabs"></nav>
<main id="view"></main>

<div id="menuOverlay" class="overlay hidden" data-action="close-menu"></div>
<div id="menuSheet" class="sheet hidden">
  <button data-action="open-cat-new">➕ 新增分類</button>
  <button data-action="open-sort">⇅ 調整分類順序</button>
  <button data-action="restore">♻️ 還原範例資料</button>
  <hr>
  <button data-action="export-json">⬇️ 匯出 JSON（備份）</button>
  <button data-action="import-json">⬆️ 匯入 JSON（還原）</button>
  <button data-action="copy-md">📄 複製 Markdown</button>
  <hr>
  <button data-action="theme-toggle">🌗 切換深色模式</button>
  <button data-action="close-menu">關閉</button>
</div>

<div id="itemModal" class="modal hidden">
  <div class="modal-card">
    <h2 id="itemModalTitle">新增品項</h2>
    <label><span id="f-name-label">品名</span><input id="f-name" autocomplete="off"></label>
    <div class="fieldhint" id="f-name-hint"></div>
    <label>分類<select id="f-cat"></select></label>
    <label>單位<input id="f-unit" placeholder="例如：箱、包、顆" autocomplete="off"></label>
    <label>目前庫存<input id="f-stock" type="number" step="0.5" min="0" inputmode="decimal"></label>
    <label>應備量<input id="f-target" type="number" step="0.5" min="0" inputmode="decimal"></label>
    <label>備註<input id="f-note" placeholder="選填" autocomplete="off"></label>
    <label class="chk"><input type="checkbox" id="f-est"> 應備量為暫估</label>
    <div class="modal-actions">
      <button data-action="delete-item" class="danger hidden" id="f-del">刪除</button>
      <button data-action="close-modal">取消</button>
      <button data-action="save-item" class="primary">儲存</button>
    </div>
  </div>
</div>

<div id="catModal" class="modal hidden">
  <div class="modal-card">
    <h2 id="catModalTitle">新增分類</h2>
    <label>圖示（可貼 emoji）<input id="cf-icon" placeholder="📦" maxlength="4" autocomplete="off"></label>
    <label>名稱<input id="cf-name" autocomplete="off"></label>
    <div class="modal-actions">
      <button data-action="delete-cat" class="danger hidden" id="cf-del">刪除</button>
      <button data-action="close-modal">取消</button>
      <button data-action="save-cat" class="primary">儲存</button>
    </div>
  </div>
</div>

<div id="sortModal" class="modal hidden">
  <div class="modal-card">
    <h2>調整分類順序</h2>
    <p class="copyhint">用 ↑ ↓ 或長按整列上下拖曳來調整順序，完成後套用。</p>
    <div id="sortList" class="sortlist"></div>
    <div class="modal-actions">
      <button data-action="close-modal">取消</button>
      <button data-action="apply-sort" class="primary">完成</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="printArea"></div>
<div id="copyModal" class="modal hidden">
  <div class="modal-card">
    <h2 id="copyModalTitle">複製備份內容</h2>
    <p class="copyhint">此裝置無法直接存檔，請按「一鍵複製」，再貼到記事本、LINE 或雲端硬碟保存。</p>
    <textarea id="copyArea" class="copyarea" readonly></textarea>
    <div class="modal-actions">
      <button data-action="close-modal">關閉</button>
      <button data-action="copy-area" class="primary">一鍵複製</button>
    </div>
  </div>
</div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
(function(){
"use strict";

var STORE_KEY = "fzkf-inventory-v1";
var THEME_KEY = "fzkf-theme";
var ORDER_TAB = "__order__";
var ALL_TAB = "__all__";

var state = null;
var currentTab = null;
var editingItemId = null;
var editingCatId = null;

/* ---------- 工具 ---------- */
function uid(){ return "x" + Date.now().toString(36) + Math.floor(Math.random()*1e8).toString(36); }
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function fmt(n){
  n = Math.round((Number(n)||0)*2)/2;
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}
function parseQty(v){
  var n = parseFloat(v);
  if(!isFinite(n) || n < 0) n = 0;
  return Math.round(n*2)/2;
}
function needOf(it){ return Math.max(0, Math.round((it.target - it.stock)*2)/2); }
function catById(id){ for(var i=0;i<state.categories.length;i++){ if(state.categories[i].id===id) return state.categories[i]; } return null; }
var WEEK = ["日","一","二","三","四","五","六"];

function toast(msg, isErr){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "show" + (isErr ? " err" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.className = ""; }, 2200);
}

/* ---------- 儲存 ---------- */
function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    var data = JSON.parse(raw);
    if(!data || !Array.isArray(data.categories) || !Array.isArray(data.items)) return null;
    return data;
  }catch(e){
    toast("讀取本機資料失敗，已載入範例資料", true);
    return null;
  }
}
function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }catch(e){
    toast("儲存失敗（瀏覽器可能已滿或被限制）", true);
  }
}

/* ---------- 範例資料 ---------- */

/* ---------- 主題 ---------- */
function applyTheme(){
  var saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  var dark;
  if(saved === "dark" || saved === "light"){
    dark = saved === "dark";
  }else{
    dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
}
function toggleTheme(){
  var isDark = document.documentElement.getAttribute("data-theme") === "dark";
  var next = isDark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){ toast("無法記住主題設定", true); }
}

/* ---------- 統計 ---------- */
function neededItemsIn(catId){
  var out = [];
  for(var i=0;i<state.items.length;i++){
    var it = state.items[i];
    if(it.categoryId === catId && needOf(it) > 0) out.push(it);
  }
  return out;
}
function totalNeeded(){
  var n = 0;
  for(var i=0;i<state.items.length;i++){ if(needOf(state.items[i]) > 0) n++; }
  return n;
}

/* ---------- 補貨清單文字 ---------- */
function orderText(){
  var now = new Date();
  var d = (now.getMonth()+1) + "/" + now.getDate();
  var lines = ["📋 補貨清單", "📅 " + d + "（週" + WEEK[now.getDay()] + "）", ""];
  var total = 0;
  for(var i=0;i<state.categories.length;i++){
    var cat = state.categories[i];
    var need = neededItemsIn(cat.id);
    if(!need.length) continue;
    lines.push("━━━━━━━━━━");
    lines.push(cat.icon + " " + cat.name);
    lines.push("━━━━━━━━━━");
    for(var j=0;j<need.length;j++){
      var it = need[j];
      var note = it.note ? "（" + it.note + "）" : "";
      lines.push("▫️ " + it.name + "　補 " + fmt(needOf(it)) + " " + it.unit + note);
      total++;
    }
    lines.push("");
  }
  if(total === 0){
    return "📋 補貨清單\n📅 " + d + "（週" + WEEK[now.getDay()] + "）\n\n目前沒有需要補貨的品項 ✅";
  }
  lines.push("✅ 共 " + total + " 項待補");
  return lines.join("\n");
}

function orderHtml(){
  var now = new Date();
  var d = (now.getMonth()+1) + "/" + now.getDate();
  var out = '<h1>📋 補貨清單</h1><div class="date">📅 ' + d + "（週" + WEEK[now.getDay()] + "）</div>";
  var total = 0;
  for(var i=0;i<state.categories.length;i++){
    var cat = state.categories[i];
    var need = neededItemsIn(cat.id);
    if(!need.length) continue;
    out += '<div class="cat">' + esc(cat.icon) + " " + esc(cat.name) + "</div>";
    for(var j=0;j<need.length;j++){
      var it = need[j];

      out += '<div class="row">▫️ ' + esc(it.name) + "　補 " + fmt(needOf(it)) + " " + esc(it.unit) + note + "</div>";

/* ---------- 複製 / 分享 / Word / 列印 ---------- */
function copyText(text, okMsg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast(okMsg || "已複製");
    }).catch(function(){
      fallbackCopy(text, okMsg);
    });
  }else{
    fallbackCopy(text, okMsg);
  }
}
function fallbackCopy(text, okMsg){
  try{
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok = document.execCommand("copy");
    document.body.removeChild(ta);
    toast(ok ? (okMsg || "已複製") : "複製失敗，請長按選取");
  }catch(e){ toast("複製失敗，請長按選取", true); }
}
function shareOrder(){
  var text = orderText();
  if(navigator.share){
    navigator.share({ text:text }).then(function(){}).catch(function(err){
      if(err && err.name === "AbortError") return;
      copyText(text, "此裝置不支援分享，已幫你複製");
    });
  }else{
    copyText(text, "此裝置不支援分享，已幫你複製");
  }
}
function downloadWord(){
  var body = orderHtml();
  var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" '
    + 'xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'
    + '<head><meta charset="utf-8"><title>補貨清單</title>'
    + '<style>@page{size:A4;margin:1.5cm}'
    + 'body{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;font-size:11pt;color:#000}'
    + 'h1{font-size:15pt;margin:0 0 2pt}.date{font-size:11pt;margin-bottom:8pt}'
    + '.cat{font-size:12pt;font-weight:bold;border-bottom:1px solid #000;margin-top:8pt;padding-bottom:2pt}'
    + '.row{font-size:11pt;line-height:1.5}.total{font-size:11pt;font-weight:bold;margin-top:10pt;border-top:1px solid #000;padding-top:4pt}'
    + '</style></head><body>' + body + '</body></html>';
  var now = new Date();
  var stamp = now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate());
  exportFile(new Blob(["\ufeff"+html], {type:"application/msword"}), "補貨清單-"+stamp+".doc", "已下載 Word 檔", null);
}
function pad(n){ return (n<10?"0":"")+n; }

function isMobile(){
  var ua = navigator.userAgent || "";
  if(/Android|iPhone|iPad|iPod/i.test(ua)) return true;
  return navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
}
function canShareFile(blob, filename){
  try{
    if(!(navigator.share && navigator.canShare)) return false;
    var file = new File([blob], filename, { type: blob.type || "application/octet-stream" });
    return navigator.canShare({ files:[file] }) ? file : false;
  }catch(e){ return false; }
}
function saveBlob(blob, filename){
  try{
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename; a.rel = "noopener";
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    return true;
  }catch(e){ return false; }
}
function exportFile(blob, filename, downloadMsg, fallbackText){
  if(isMobile()){
    var file = canShareFile(blob, filename);
    if(file){
      navigator.share({ files:[file], title: filename }).then(function(){
        toast("已開啟分享，選「儲存到檔案」即可");
      }).catch(function(err){
        if(err && err.name === "AbortError") return;
        if(fallbackText != null) showCopyModal(fallbackText);
        else toast("分享未完成，可改用電腦下載", true);
      });
      return true;
    }
    if(fallbackText != null){ showCopyModal(fallbackText); return true; }
    toast("此裝置無法下載，請改用電腦", true);
    return false;
  }
  if(saveBlob(blob, filename)){ toast(downloadMsg); return true; }
  if(fallbackText != null){ showCopyModal(fallbackText); return true; }
  toast("下載失敗", true);
  return false;
}
function showCopyModal(text){
  document.getElementById("copyModalTitle").textContent = "複製備份內容";
  document.getElementById("copyArea").value = text;
  document.getElementById("copyModal").className = "modal";
}

function exportJson(){

  var stamp = now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate());

  exportFile(new Blob([data], {type:"application/json"}), "風自然廚房庫存-"+stamp+".json", "已匯出 JSON 備份", data);

function importJson(file){
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.categories) || !Array.isArray(data.items)){
        throw new Error("格式錯誤");
      }
      if(!confirm("匯入後將覆蓋目前所有資料，確定要繼續嗎？")) return;
      state = data;
      currentTab = ALL_TAB;
      save(); render(); toast("已匯入資料");
    }catch(e){
      toast("匯入失敗：檔案格式不正確", true);
    }
  };
  reader.onerror = function(){ toast("讀取檔案失敗", true); };
  reader.readAsText(file, "utf-8");
}

/* ---------- Markdown ---------- */
function buildMarkdown(){
  var lines = ["# 風自然廚房庫存清單", ""];
  for(var i=0;i<state.categories.length;i++){
    var cat = state.categories[i];
    lines.push("## " + cat.icon + " " + cat.name);
    var items = [];
    for(var k=0;k<state.items.length;k++){ if(state.items[k].categoryId===cat.id) items.push(state.items[k]); }
    if(!items.length){ lines.push(""); lines.push("_（無品項）_"); lines.push(""); continue; }
    lines.push("");
    lines.push("| 品名 | 單位 | 目前庫存 | 應備量 | 需補 | 備註 |");
    lines.push("|---|---|---|---|---|---|");
    for(var j=0;j<items.length;j++){
      var it = items[j];
      var n = needOf(it);
      lines.push("| " + it.name + " | " + it.unit + " | " + fmt(it.stock) + " | "
        + fmt(it.target) + (it.estTarget?"（暫估）":"") + " | "
        + (n>0 ? fmt(n) : "-") + " | " + (it.note||"") + " |");
    }
    lines.push("");
  }
  return lines.join("\n");
}

function splitNames(s){
  var parts = String(s).split(/[.\-－、。\n\r]+/);
  var out = [];
  for(var i=0;i<parts.length;i++){ var p = parts[i].trim(); if(p) out.push(p); }
  return out;
}
function saveItem(){
  var rawName = document.getElementById("f-name").value.trim();
  if(!rawName){ toast("請輸入品名", true); return; }
  var unit = document.getElementById("f-unit").value.trim();
  var stock = parseQty(document.getElementById("f-stock").value);
  var target = parseQty(document.getElementById("f-target").value);
  var note = document.getElementById("f-note").value.trim();
  var est = document.getElementById("f-est").checked;
  var catId = document.getElementById("f-cat").value;
  if(editingItemId){
    for(var i=0;i<state.items.length;i++){
      if(state.items[i].id===editingItemId){
        var it = state.items[i];
        it.name=rawName; it.unit=unit; it.stock=stock; it.target=target; it.note=note; it.estTarget=est; it.categoryId=catId;
        break;
      }
    }
    save(); closeModals(); render(); toast("已儲存");
  }else{
    var names = splitNames(rawName);
    if(!names.length){ toast("請輸入品名", true); return; }
    for(var j=0;j<names.length;j++){
      state.items.push({ id:uid(), categoryId:catId, name:names[j], unit:unit, stock:stock, target:target, note:note, estTarget:est });
    }
    save(); closeModals(); render();
    toast(names.length > 1 ? ("已新增 "+names.length+" 個品項") : "已儲存");
  }
}
function deleteItem(){
  if(!editingItemId) return;
  if(!confirm("確定要刪除這個品項嗎？")) return;
  var out = [];
  for(var i=0;i<state.items.length;i++){ if(state.items[i].id!==editingItemId) out.push(state.items[i]); }
  state.items = out;
  save(); closeModals(); render(); toast("已刪除品項");
}
function saveCat(){
  var name = document.getElementById("cf-name").value.trim();
  if(!name){ toast("請輸入分類名稱", true); return; }
  var icon = document.getElementById("cf-icon").value.trim() || "📦";
  if(editingCatId){
    var c = catById(editingCatId);
    if(c){ c.name=name; c.icon=icon; }
  }else{
    state.categories.push({ id:uid(), name:name, icon:icon });
  }
  save(); closeModals(); render(); toast("已儲存");
}
function deleteCat(){
  var cat = catById(editingCatId);
  if(!cat){ toast("找不到分類", true); return; }
  var n = 0;
  for(var i=0;i<state.items.length;i++){ if(state.items[i].categoryId===cat.id) n++; }
  var msg = n>0 ? ("刪除分類「"+cat.name+"」將連同 "+n+" 個品項一起刪除，確定嗎？")
                : ("確定要刪除分類「"+cat.name+"」嗎？");
  if(!confirm(msg)) return;
  var kept = [];
  for(var j=0;j<state.items.length;j++){ if(state.items[j].categoryId!==cat.id) kept.push(state.items[j]); }
  state.items = kept;
  var cats = [];
  for(var k=0;k<state.categories.length;k++){ if(state.categories[k].id!==cat.id) cats.push(state.categories[k]); }
  state.categories = cats;
  save(); closeModals(); render(); toast("已刪除分類");
}
var sortWorking = null;
function openSortModal(){
  sortWorking = state.categories.map(function(c){ return c.id; });
  renderSortList();
  document.getElementById("sortModal").className = "modal";
}
function renderSortList(){
  var box = document.getElementById("sortList");
  var html = "";
  for(var i=0;i<sortWorking.length;i++){
    var c = catById(sortWorking[i]);
    if(!c) continue;
    html += '<div class="sortrow" data-cid="'+c.id+'">'
          + '<button class="sortbtn" data-action="sort-up" data-id="'+c.id+'"'+(i===0?' disabled':'')+'>↑</button>'
          + '<span class="sortname">'+esc(c.icon)+' '+esc(c.name)+'</span>'
          + '<button class="sortbtn" data-action="sort-down" data-id="'+c.id+'"'+(i===sortWorking.length-1?' disabled':'')+'>↓</button>'
          + '</div>';
  }
  box.innerHTML = html;
}
function moveSort(id, dir){
  var idx = sortWorking.indexOf(id);
  var j = idx + dir;
  if(idx < 0 || j < 0 || j >= sortWorking.length) return;
  var t = sortWorking[idx];
  sortWorking[idx] = sortWorking[j];
  sortWorking[j] = t;
  renderSortList();
}
function applySort(){
  var map = {};
  for(var i=0;i<state.categories.length;i++){ map[state.categories[i].id] = state.categories[i]; }
  var out = [];
  for(var k=0;k<sortWorking.length;k++){ if(map[sortWorking[k]]) out.push(map[sortWorking[k]]); }
  if(out.length === state.categories.length){ state.categories = out; save(); }
  closeModals(); render(); toast("已更新分類順序");
}

/* ---------- 排序頁：長按拖曳 ---------- */
var sortPress = null, sortDragRow = null;

function sortRowFromEl(t){
  while(t && t !== document.body){
    if(t.classList && t.classList.contains("sortrow")) return t;
    t = t.parentNode;
  }
  return null;
}
function activateSortDrag(){
  if(!sortPress) return;
  sortDragRow = sortPress.row;
  sortPress = null;
  sortDragRow.classList.add("drag-active");
  try{ window.getSelection && window.getSelection().removeAllRanges(); }catch(err){}
  try{ navigator.vibrate && navigator.vibrate(15); }catch(err){}
}
function reorderSortByY(y){
  var list = document.getElementById("sortList");
  var lr = list.getBoundingClientRect();
  if(y < lr.top + 28) list.scrollTop -= 8;
  else if(y > lr.bottom - 28) list.scrollTop += 8;
  var rows = Array.prototype.slice.call(list.querySelectorAll(".sortrow"));
  var ref = null;
  for(var i=0;i<rows.length;i++){
    if(rows[i] === sortDragRow) continue;
    var r = rows[i].getBoundingClientRect();
    if(y < r.top + r.height/2){ ref = rows[i]; break; }
  }
  if(ref) list.insertBefore(sortDragRow, ref);
  else list.appendChild(sortDragRow);
}
function finishSortDrag(){
  sortDragRow.classList.remove("drag-active");
  var list = document.getElementById("sortList");
  var rows = Array.prototype.slice.call(list.querySelectorAll(".sortrow"));
  sortWorking = rows.map(function(r){ return r.getAttribute("data-cid"); });
  sortDragRow = null;
  renderSortList();
}
function onSortTouchStart(e){
  if(e.touches && e.touches.length !== 1) return;
  var t = e.target;
  if(t.closest && t.closest("button")) return;
  var row = sortRowFromEl(t);
  if(!row) return;
  sortPress = { row:row, y:e.touches[0].clientY, timer:null };
  sortPress.timer = setTimeout(activateSortDrag, 250);
}
function onSortTouchMove(e){
  if(sortDragRow){
    e.preventDefault();
    reorderSortByY(e.touches[0].clientY);
    return;
  }
  if(sortPress){
    if(Math.abs(e.touches[0].clientY - sortPress.y) > 10){
      clearTimeout(sortPress.timer); sortPress = null;
    }
  }
}
function onSortTouchEnd(){
  if(sortPress){ clearTimeout(sortPress.timer); sortPress = null; }
  if(sortDragRow) finishSortDrag();
}
function onSortMouseDown(e){
  if(e.button !== 0) return;
  var t = e.target;
  if(t.closest && t.closest("button")) return;
  var row = sortRowFromEl(t);
  if(!row) return;
  e.preventDefault();
  sortPress = { row:row, y:e.clientY, timer:null };
  sortPress.timer = setTimeout(activateSortDrag, 250);
}
function onDocMouseMove(e){
  if(sortDragRow){ e.preventDefault(); reorderSortByY(e.clientY); return; }
  if(sortPress && Math.abs(e.clientY - sortPress.y) > 10){
    clearTimeout(sortPress.timer); sortPress = null;
  }
}
function onDocMouseUp(){
  if(sortPress){ clearTimeout(sortPress.timer); sortPress = null; }
  if(sortDragRow) finishSortDrag();
}

/* ---------- 全部品項：長按品項進入編輯 ---------- */
var editPress = null;

function editRowFromEl(t){
  while(t && t !== document.body){
    if(t.classList && t.classList.contains("allrow")) return t;
    t = t.parentNode;
  }
  return null;
}
function onRowTouchStart(e){
  if(e.touches && e.touches.length !== 1) return;
  var t = e.target;
  if(t.closest && t.closest("button,input,select,textarea")) return;
  var row = editRowFromEl(t);
  if(!row) return;
  var id = row.getAttribute("data-id");
  if(!id) return;
  editPress = { id:id, y:e.touches[0].clientY, timer:null };
  editPress.timer = setTimeout(fireEditPress, 500);
}
function onRowTouchMove(e){
  if(editPress && Math.abs(e.touches[0].clientY - editPress.y) > 10){
    clearTimeout(editPress.timer); editPress = null;
  }
}
function onRowTouchEnd(){
  if(editPress){ clearTimeout(editPress.timer); editPress = null; }
}
function onRowMouseDown(e){
  if(e.button !== 0) return;
  var t = e.target;
  if(t.closest && t.closest("button,input,select,textarea")) return;
  var row = editRowFromEl(t);
  if(!row) return;
  var id = row.getAttribute("data-id");
  if(!id) return;
  editPress = { id:id, y:e.clientY, timer:null };
  editPress.timer = setTimeout(fireEditPress, 500);
}
function onRowDocMouseMove(e){
  if(editPress && Math.abs(e.clientY - editPress.y) > 10){
    clearTimeout(editPress.timer); editPress = null;
  }
}
function onRowDocMouseUp(){
  if(editPress){ clearTimeout(editPress.timer); editPress = null; }
}
function fireEditPress(){
  var id = editPress && editPress.id;
  editPress = null;
  if(!id) return;
  try{ window.getSelection && window.getSelection().removeAllRanges(); }catch(err){}
  try{ navigator.vibrate && navigator.vibrate(15); }catch(err){}
  openItemModal(id);
}

function restoreSeed(){
  if(!confirm("將還原成範例資料，目前所有變更都會消失，確定嗎？")) return;
  state = seed();
  currentTab = ALL_TAB;
  save(); closeMenu(); render(); toast("已還原範例資料");
}

/* ---------- 事件 ---------- */
function findItem(id){ for(var i=0;i<state.items.length;i++){ if(state.items[i].id===id) return state.items[i]; } return null; }

function onClick(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  var a = el.getAttribute("data-action");
  var id = el.getAttribute("data-id");
  switch(a){
    case "tab": currentTab = id; closeMenu(); render(); window.scrollTo({top:0}); break;
    case "jump":
      var sec = document.querySelector('.cat-section[data-cat="'+id+'"]');
      if(sec){ window.scrollTo({ top: sec.getBoundingClientRect().top + window.pageYOffset - 138, behavior:"smooth" }); }
      break;
    case "step":
      var it = findItem(id);
      if(it){ it.stock = Math.max(0, Math.round((it.stock + parseFloat(el.getAttribute("data-delta")))*2)/2); save(); render(); }
      break;
    case "tstep":
      var it2 = findItem(id);
      if(it2){ it2.target = Math.max(0, Math.round((it2.target + parseFloat(el.getAttribute("data-delta")))*2)/2); save(); render(); }
      break;
    case "edit-item": openItemModal(id); break;
    case "add-item": openItemModal(null); break;
    case "add-item-cat": openItemModal(null, id); break;
    case "open-cat": openCatModal(id); break;
    case "open-menu": openMenu(); break;
    case "close-menu": closeMenu(); break;
    case "open-cat-new": closeMenu(); openCatModal(null); break;
    case "open-sort": closeMenu(); openSortModal(); break;
    case "sort-up": moveSort(id, -1); break;
    case "sort-down": moveSort(id, 1); break;
    case "apply-sort": applySort(); break;
    case "delete-cat": deleteCat(); break;
    case "restore": restoreSeed(); break;
    case "export-json": closeMenu(); exportJson(); break;
    case "import-json": closeMenu(); document.getElementById("importFile").click(); break;
    case "copy-md": closeMenu(); copyText(buildMarkdown(), "已複製 Markdown"); break;
    case "theme-toggle": toggleTheme(); break;
    case "close-modal": closeModals(); break;
    case "save-item": saveItem(); break;
    case "delete-item": deleteItem(); break;
    case "save-cat": saveCat(); break;
    case "copy-area": copyText(document.getElementById("copyArea").value, "已複製"); break;
    case "copy-order": copyText(orderText(), "已複製補貨清單"); break;
    case "share-order": shareOrder(); break;
    case "download-word": downloadWord(); break;
    case "print-order": printOrder(); break;
  }
}

function onFocusIn(e){
  if(e.target && e.target.getAttribute){
    var r = e.target.getAttribute("data-role");
    if(r === "stock" || r === "target"){ try{ e.target.select(); }catch(err){} }
  }
}
function onChange(e){
  var t = e.target;
  if(!t || !t.getAttribute) return;
  var role = t.getAttribute("data-role");
  if(role !== "stock" && role !== "target") return;
  var it = findItem(t.getAttribute("data-id"));
  if(!it) return;
  if(role === "stock") it.stock = parseQty(t.value); else it.target = parseQty(t.value);
  save(); render();
}
function onKeydown(e){
  if(e.key === "Escape"){ closeModals(); closeMenu(); }
}

/* ---------- 啟動 ---------- */
function init(){
  applyTheme();
  state = load();
  if(!state){ state = seed(); save(); }
  currentTab = ALL_TAB;

  document.getElementById("importFile").addEventListener("change", function(ev){
    var f = ev.target.files && ev.target.files[0];
    if(f) importJson(f);
    ev.target.value = "";
  });
  document.addEventListener("click", onClick);
  document.addEventListener("focusin", onFocusIn);
  document.addEventListener("change", onChange);
  document.addEventListener("keydown", onKeydown);

  var sl = document.getElementById("sortList");
  sl.addEventListener("touchstart", onSortTouchStart, { passive:false });
  sl.addEventListener("touchmove", onSortTouchMove, { passive:false });
  sl.addEventListener("touchend", onSortTouchEnd);
  sl.addEventListener("touchcancel", onSortTouchEnd);
  sl.addEventListener("mousedown", onSortMouseDown);
  document.addEventListener("mousemove", onDocMouseMove);
  document.addEventListener("mouseup", onDocMouseUp);

  var vw = document.getElementById("view");
  vw.addEventListener("touchstart", onRowTouchStart, { passive:false });
  vw.addEventListener("touchmove", onRowTouchMove);
  vw.addEventListener("touchend", onRowTouchEnd);
  vw.addEventListener("touchcancel", onRowTouchEnd);
  vw.addEventListener("mousedown", onRowMouseDown);
  document.addEventListener("mousemove", onRowDocMouseMove);
  document.addEventListener("mouseup", onRowDocMouseUp);

  render();
}

init();
})();
</script>
</body>
</html>
